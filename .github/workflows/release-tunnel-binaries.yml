name: Release tunnel binaries

# Rebuilds the four vendored tunnel binaries (tailscale, cloudflared, zrok, sing-box) at
# maximum compression and publishes them to a dated `tunnel-binaries-<YYYY.MM.DD>` release,
# which app/tunnel-binaries.lock then pins as the app build's fetch source.
#
# MANUAL ONLY. Run this when you bump a tunnel version in app/tunnel-binaries.lock. It does
# NOT run on app releases: the app build fetches the pinned tunnel-binaries release, so
# rebuilding the ~100 MB set on every app release would be an hour of CI for an artifact
# nothing uses.
#
# Single source of truth: the versions built come from app/tunnel-binaries.lock — the
# reusable build workflow reads them there, not from inputs here. After this publishes,
# copy the printed tag + base_url + SHA256SUMS back into app/tunnel-binaries.lock.

on:
  workflow_dispatch:
    inputs:
      compression:
        description: "max (--best --lzma, for release) or fast (default UPX)"
        type: choice
        options: ["max", "fast"]
        default: "max"

permissions:
  contents: read

concurrency:
  group: release-tunnel-binaries
  cancel-in-progress: false # never cancel a release build half-way

jobs:
  build:
    name: Build at maximum compression
    # refs are omitted on purpose — the reusable workflow reads them from
    # app/tunnel-binaries.lock (the single source of truth).
    uses: ./.github/workflows/tunnel-binaries.yml
    with:
      compression: ${{ inputs.compression || 'max' }}

  publish:
    name: Publish dated tunnel-binaries release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Publishes to the wheelstop-assets HOSTING repo, not this one — so it mints the
    # wheelstop-release App token (GITHUB_TOKEN only has write to this repo). PREREQUISITE:
    # the wheelstop-release GitHub App must be installed on wheelstop-app/wheelstop-assets.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tunnel-binaries-arm64
          path: artifact

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: bot
        with:
          app-id: Iv23livK39Yzp2c9rPlq
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: wheelstop-app
          repositories: wheelstop-assets
          permission-contents: write

      - name: Publish and print the lock update
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          # No checkout in this job, so gh cannot infer the repo — tell it explicitly.
          GH_REPO: wheelstop-app/wheelstop-assets
        run: |
          set -euo pipefail
          ls -laR artifact
          TAG="tunnel-binaries-$(date -u +%Y.%m.%d)"
          NOTES="Vendored tunnel binaries (arm64), max compression. Pin the tag, base_url and the SHA256SUMS below in app/tunnel-binaries.lock. SHA256SUMS + PROVENANCE + VERSIONS are attached."
          ASSETS=(artifact/dist/*.so artifact/dist/SHA256SUMS artifact/out/PROVENANCE.txt artifact/out/VERSIONS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes "$NOTES"
          fi
          echo "::notice::published $TAG"
          echo "----------------------------------------------------------------"
          echo "Update app/tunnel-binaries.lock with:"
          echo "  release = $TAG"
          echo "  base_url = https://github.com/${GH_REPO}/releases/download/${TAG}"
          echo "and the sha256_shipped digests from:"
          echo "----------------------------------------------------------------"
          cat artifact/dist/SHA256SUMS
