name: Release

# Signed release build. Builds :app:assembleRelease with the release signing key (loaded
# from secrets), refuses to publish anything signed with a different certificate, and pushes
# the APK + SHA256SUMS to the rolling "alpha" release the in-app updater reads. Same-cert
# signing is what lets the car install the update in place (pm install -r) with no data wipe.
#
# Two triggers:
#   - `release: published` — the normal path. release-please.yml tags and publishes a semver
#     GitHub Release (e.g. v1.2.3) on a bot token, which is what lets that "published" event
#     fire this workflow (GITHUB_TOKEN-authored release events don't trigger other workflows).
#     VERSION comes from the release tag.
#   - `workflow_dispatch` — manual fallback for rebuilding/republishing a specific version
#     without cutting a new release-please release.
#
# No actions/cache here (unlike build.yml): this job signs and publishes the artifact a user's
# car will `pm install -r`. Restoring a Gradle/native-dep cache that some other, less-trusted
# workflow run wrote (build.yml runs on every branch push) into a signing job is exactly the
# cache-poisoning shape zizmor's cache-poisoning audit flags — so the release build always
# starts cold.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version label, e.g. 1.2.3 (a leading 'v' is stripped if present; must sort newer than what's on the car)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build, cert-gate, publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create/update the alpha release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch) RAW="$DISPATCH_VERSION" ;;
            release) RAW="$RELEASE_TAG" ;;
            *) echo "::error::unsupported trigger event: $EVENT_NAME"; exit 1 ;;
          esac
          VERSION="${RAW#v}" # strip a leading v — release tags always have one, a manual input might
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a version from event '$EVENT_NAME'"; exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::version '$VERSION' is not of the form MAJOR.MINOR[.PATCH]"; exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH="${PATCH:-0}"
          # Monotonic Android versionCode. Assumes MINOR and PATCH stay under 100 — true for
          # this project's history (single/double-digit components) and revisited if it isn't.
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 secret is not set"; exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          WHEELSTOP_VERSION_NAME: ${{ steps.version.outputs.version }}
          WHEELSTOP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --console=plain \
            -PwheelstopVersionName="$WHEELSTOP_VERSION_NAME" \
            -PwheelstopVersionCode="$WHEELSTOP_VERSION_CODE"

      - name: Gate on the pinned signing certificate
        env:
          # The release signer's cert SHA-256, pinned as a repo/org variable (it's public — the
          # cert fingerprint, not the key). Set once: `gh variable set RELEASE_SIGNER_SHA256
          # --org wheelstop-app --body <sha256>`. Rotating keys is then a one-line variable change.
          EXPECTED_CERT: ${{ vars.RELEASE_SIGNER_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "${EXPECTED_CERT:-}" ]; then
            echo "::error::RELEASE_SIGNER_SHA256 variable is not set — cannot gate the signature"; exit 1
          fi
          EXPECTED_CERT=$(printf '%s' "$EXPECTED_CERT" | tr 'A-F' 'a-f' | tr -d ' :')
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "::error::no release APK produced"; exit 1; fi
          echo "Signed APK: $APK"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using $APKSIGNER"
          GOT=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i "certificate SHA-256 digest" | head -1 \
            | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{64}')
          echo "signer SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT" ]; then
            echo "::error::signer cert $GOT != pinned $EXPECTED_CERT — refusing to publish"; exit 1
          fi

      - name: Stage assets (versioned APK + SHA256SUMS)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          mkdir -p dist
          cp "$APK" "dist/wheelstop-alpha-${VERSION}.apk"
          ( cd dist && sha256sum "wheelstop-alpha-${VERSION}.apk" | tee SHA256SUMS )

      - name: Publish to the rolling alpha release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="Signed release ${VERSION}. Cert-gated to the pinned release signer. Installs in place via same-cert pm install -r."
          if gh release view alpha >/dev/null 2>&1; then
            gh release upload alpha "dist/wheelstop-alpha-${VERSION}.apk" dist/SHA256SUMS --clobber
            gh release edit alpha --title "alpha ${VERSION}" --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create alpha \
              "dist/wheelstop-alpha-${VERSION}.apk" dist/SHA256SUMS \
              --title "alpha ${VERSION}" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
