name: Build

# Unit tests + a debug APK on every push and PR. There was no build CI before this, so
# nothing checked that the tree compiles, that the tests pass, or that a clean checkout
# can even resolve its native dependencies (opencv-mobile and OpenH264 are gitignored and
# fetched at build time — see app/build.gradle.kts).
on:
  # Build main pushes (post-merge verification) and every PR. A PR'd feature branch
  # is covered by its pull_request run, so building all branch pushes too would just
  # run the whole NDK build twice for the same commit — hence push is scoped to main.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the in-flight run obsolete. Cancel it rather than
# paying for two full NDK builds.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's credentials in .git/config — this job only reads
          # the tree and never pushes, and a persisted token can ride along into
          # anything built from the workspace.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK + CMake
        # Pinned to the versions app/build.gradle.kts asks for (ndkVersion) and the CMake
        # the project's CMakeLists requires. Installing explicitly keeps the failure at
        # this step, with a clear message, instead of surfacing as a confusing Gradle error.
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache native dependencies
        # opencv-mobile is an 18 MB download and OpenH264 another 0.5 MB, on every build.
        # Both are digest-pinned in app/build.gradle.kts, so caching them cannot smuggle in
        # a different artifact — a cache hit that did would fail verification on restore.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/src/main/cpp/opencv
            app/src/main/cpp/openh264
          key: native-deps-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}

      - name: Unit tests + assemble debug APK
        # One Gradle invocation for both tasks: the configuration phase and the debug
        # compilation are shared instead of paid twice across two --no-daemon runs.
        # --build-cache reuses task outputs restored from the Gradle cache above.
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain --build-cache

      - name: Verify the APK actually contains the native libs
        # Guards the failure mode this CI exists for: the native dependency fetch used to
        # fail soft, and CMake would then build a libsurveillance.so with motion detection
        # compiled out. That produced a green build and a broken APK. Assert the payload.
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Inspecting $APK"
          libs=$(unzip -l "$APK" | awk '/lib\/arm64-v8a\/.*\.so$/ {print $4}')
          echo "$libs"
          # The tunnel binaries are no longer committed — they are fetched by
          # downloadTunnelBinaries. If that task ever silently no-ops, the APK would build
          # fine and ship without them, so assert they made it in.
          # NOTE: libod.so (upstream's compiled blind-spot blob) is intentionally NOT in this
          # list — Wheelstop reimplements those coefficients in Kotlin (BsCoefficients.kt), so
          # the APK ships no libod.so by design.
          for required in libsurveillance.so libopenh264.so \
                          libtailscale.so libcloudflared.so libzrok.so libsingbox.so; do
            echo "$libs" | grep -q "$required" \
              || { echo "::error::$required missing from the APK"; exit 1; }
          done

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
