name: Workflow security

# Static analysis of the workflows themselves, with zizmor.
#
# CI configuration is code with credentials attached, and it is the one kind of code in
# this repo that nothing else reviews. zizmor catches the classes of mistake that are easy
# to make and expensive to get wrong — template injection from attacker-controllable
# context into a `run:` block, actions referenced by mutable tag instead of commit,
# over-broad `permissions:`, credential persistence from checkout.
#
# It runs on changes to .github/ so a workflow edit cannot land without it.

on:
  push:
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          # SARIF upload to code scanning needs `security-events: write` and GitHub
          # Advanced Security, which is not available on this repo. Keep the job's
          # permissions minimal and let a finding fail the step instead.
          advanced-security: false
          # `pedantic` rather than the default `regular`. The default suppresses a set of
          # findings that includes real least-privilege issues — it was hiding a High
          # (workflow-level `issues: write` in issue-welcome.yml) behind "no findings".
          # All of them are fixed, so the stricter setting costs nothing and keeps it that way.
          persona: pedantic
          # Fail on medium and above. `pedantic` also emits informational/low style notes
          # (job naming, concurrency groups, "you could use `gh issue comment` instead"),
          # which are useful to read but a poor reason to block a merge.
          min-severity: medium
