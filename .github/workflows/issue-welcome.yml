name: Issue Welcome Bot

on:
  issues:
    types: [opened]

# Default to nothing at the workflow level; the one job that needs a write scope
# requests it for itself. Workflow-level `issues: write` grants it to every job that
# might later be added to this file, which is the least-privilege problem zizmor flags.
permissions: {}

jobs:
  welcome:
    name: Comment on new issue
    runs-on: ubuntu-latest
    permissions:
      # Needed only to post the welcome comment below.
      issues: write
    steps:
      - name: Comment on new issue
        # Pinned to a commit rather than the mutable v4 tag: this job holds
        # `issues: write`, so whoever controls that tag controls that permission.
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            👋 Thanks for opening this issue!

            Just a friendly heads-up — **OverDrive is a free, open-source project** maintained in spare time. There are no deadlines, no paid team, and no guarantees on response times.

            We'll do our best to look into this when we can, but please be patient. If you'd like to speed things up, **pull requests are always welcome!** Check out our [Contributing Guide](../blob/main/CONTRIBUTING.md) to get started.

            Thanks for understanding and for being part of the community 🙏
